---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - etherpad.etherpadinstance.io
  resources:
  - etherpadinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - etherpad.etherpadinstance.io
  resources:
  - etherpadinstances/finalizers
  verbs:
  - update
- apiGroups:
  - etherpad.etherpadinstance.io
  resources:
  - etherpadinstances/status
  verbs:
  - get
  - patch
  - update
